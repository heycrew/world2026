# ===== world2026.liubaizhiying.cn Nginx 配置 =====
# 将此文件放到 /etc/nginx/sites-available/world2026
# 然后执行: ln -s /etc/nginx/sites-available/world2026 /etc/nginx/sites-enabled/
# 最后: nginx -t && nginx -s reload

server {
    listen 80;
    server_name world2026.liubaizhiying.cn;

    # 日志
    access_log /var/log/nginx/world2026-access.log;
    error_log  /var/log/nginx/world2026-error.log;

    # 前端静态文件（直接由 Nginx 托管，性能更好）
    location /css/ {
        alias /path/to/world2026/public/css/;
        expires 7d;
    }
    location /js/ {
        alias /path/to/world2026/public/js/;
        expires 7d;
    }
    location /favicon.ico {
        alias /path/to/world2026/public/favicon.ico;
    }

    # API 请求代理到 Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;  # AI 响应较慢，延长超时
    }

    # 其余请求代理到 Node.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
